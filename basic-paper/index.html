<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ReST-Lake Basic Paper: With-Memory and Zero-Memory Baseline model runs.">
  <title>ReST-Lake | Basic Paper</title>
  <link rel="stylesheet" href="style.css?v=restlake-20261023b">
  <link rel="stylesheet" href="comparison.css?v=basic-paper-v1">
  <style>
    .basic-header{max-width:1100px;margin:0 auto;padding:30px 20px 10px;}
    .basic-header h1{font-size:clamp(1.5rem,3vw,2rem);margin:0 0 6px;color:#15364c;}
    .basic-header p{color:#557483;margin:0;line-height:1.6;}
    #compareModels{padding-top:20px;}
    .comparison .panel__heading{margin-bottom:10px;}
    .comparison iframe{min-height:700px;}
    @media(max-width:600px){.basic-header{padding:20px 14px 8px;}#compareModels{padding:12px;}}
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="basic-header">
      <h1>ReST-Lake — Basic Paper</h1>
      <p>Upload a model-input CSV and run either of the two models.</p>
    </header>
    <main class="container">
      <section id="compareModels" class="panel comparison">
        <div class="cmp-tabs" role="tablist" aria-label="Model selection">
          <button id="tabMemory" type="button" role="tab" aria-selected="true" aria-controls="memoryPane" class="cmp-active">With Memory</button>
          <button id="tabBaseline" type="button" role="tab" aria-selected="false" aria-controls="baselinePane">Baseline (M = 0)</button>
        </div>
        <p class="helper" id="modeNote">With Memory: upload your CSV below to calibrate, validate and run the thermal-response model.</p>
        <section id="memoryPane" role="tabpanel" aria-labelledby="tabMemory">
          <iframe id="frameMemory" title="With-Memory model" src="with-memory/index.html" loading="eager"></iframe>
        </section>
        <section id="baselinePane" role="tabpanel" aria-labelledby="tabBaseline" hidden>
          <iframe id="frameBaseline" title="Zero-Memory Baseline model" src="baseline/index.html" loading="eager"></iframe>
        </section>
      </section>
    </main>
    <footer class="cmp-footer">ReST-Lake · © 2026 Zainab Khan</footer>
  </div>
  <script src="comparison.js?v=basic-paper-v1"></script>
</body>
</html>
